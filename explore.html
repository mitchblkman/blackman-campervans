<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore the Build — Blackman Campervans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
<style>
:root{--navy:#080D14;--navy-mid:#0D1520;--gold:#C8A96E;--gold-light:#E4C98A;--white:#F4F1EC;--grey:#8A9BAD}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--navy);color:var(--white);font-family:'Montserrat',sans-serif;font-weight:300;display:flex;flex-direction:column}

/* TOP BAR */
#topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:.9rem 2rem;
  background:rgba(8,13,20,.97);
  border-bottom:1px solid rgba(200,169,110,.1);
  flex-shrink:0;
  z-index:10;
}
.bar-logo{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:1rem;letter-spacing:.2em;text-transform:uppercase;color:var(--white);text-decoration:none}
.bar-logo span{color:var(--gold);font-style:italic}
.bar-back{font-size:.6rem;letter-spacing:.25em;text-transform:uppercase;color:rgba(244,241,236,.45);text-decoration:none;border:1px solid rgba(200,169,110,.2);padding:.4rem 1rem;transition:all .3s}
.bar-back:hover{border-color:var(--gold);color:var(--gold)}
.bar-title{font-size:.6rem;letter-spacing:.35em;text-transform:uppercase;color:var(--grey)}

/* CANVAS */
#cv{display:block;flex:1;width:100%;cursor:grab}
#cv:active{cursor:grabbing}

/* CONTROLS */
#controls{
  position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:.4rem;
  background:rgba(8,13,20,.88);backdrop-filter:blur(12px);
  padding:.55rem 1rem;border:1px solid rgba(200,169,110,.15);
  z-index:10;
}
.cb{font-family:'Montserrat',sans-serif;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;background:transparent;border:1px solid rgba(200,169,110,.2);color:rgba(244,241,236,.55);padding:.35rem .85rem;cursor:pointer;transition:all .25s}
.cb:hover,.cb.on{border-color:var(--gold);color:var(--gold)}
.cb.on{background:rgba(200,169,110,.08)}
.cs{width:1px;height:12px;background:rgba(200,169,110,.18)}

/* HINT */
#hint{
  position:fixed;top:5rem;left:50%;transform:translateX(-50%);
  font-size:.58rem;letter-spacing:.3em;text-transform:uppercase;
  color:rgba(244,241,236,.3);
  pointer-events:none;
  opacity:1;transition:opacity 1s;
}
#hint.hidden{opacity:0}

/* LOAD OVERLAY */
#ov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;background:var(--navy);transition:opacity .8s}
#ov.gone{opacity:0;pointer-events:none}
.ov-logo{font-family:'Cormorant Garamond',serif;font-size:1.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:300}
.ov-sub{font-size:.62rem;letter-spacing:.35em;text-transform:uppercase;color:var(--grey)}
.ov-bar{width:200px;height:1px;background:rgba(200,169,110,.15)}
.ov-fill{height:100%;background:var(--gold);width:0%;transition:width .3s}

/* INFO PANEL */
#info-panel{
  position:fixed;right:2rem;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:.4rem;
  opacity:0;transition:opacity .5s;
}
#info-panel.visible{opacity:1}
.info-item{font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(244,241,236,.3);text-align:right;line-height:1.8}
.info-item strong{color:rgba(200,169,110,.7);display:block;font-weight:400}

@media(max-width:700px){
  #topbar{padding:.7rem 1rem}
  .bar-title{display:none}
  #info-panel{display:none}
  #controls{gap:.3rem;padding:.45rem .7rem}
}
</style>
</head>
<body>

<div id="topbar">
  <a href="index.html" class="bar-back">&larr; Back</a>
  <span class="bar-title">Interactive 3D Explorer</span>
  <a href="index.html" class="bar-logo">Blackman <span>Campervans</span></a>
</div>

<canvas id="cv"></canvas>

<div id="hint">Drag to rotate &nbsp;&middot;&nbsp; Scroll or pinch to zoom &nbsp;&middot;&nbsp; Arrow keys to orbit</div>

<div id="info-panel">
  <div class="info-item"><strong>Ford Transit</strong>Custom High Roof</div>
  <div class="info-item"><strong>200Ah</strong>LiFePO&#8322; Battery</div>
  <div class="info-item"><strong>400W</strong>Solar Input</div>
  <div class="info-item"><strong>60L</strong>Fresh Water</div>
</div>

<div id="controls">
  <button class="cb" onclick="zoomIn()">+ Zoom</button>
  <button class="cb" onclick="zoomOut()">&minus; Zoom</button>
  <div class="cs"></div>
  <button class="cb" id="cb-pan" onclick="togglePan()">Pan</button>
  <button class="cb on" id="cb-auto" onclick="toggleAuto()">Auto Rotate</button>
  <button class="cb" onclick="resetCam()">Reset</button>
</div>

<div id="ov">
  <div class="ov-logo">Blackman</div>
  <div class="ov-bar"><div class="ov-fill" id="ov-fill"></div></div>
  <div class="ov-sub" id="ov-txt">Loading your van</div>
</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
var theta=0.3,phi=0.9,radius=9;
var autoRot=true,panMode=false;
var drag=false,lx=0,ly=0;
var renderer,scene,camera,target;

function setup(){
  var cv=document.getElementById('cv');
  var w=cv.clientWidth,h=cv.clientHeight;
  renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setClearColor(0x080D14,1);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.5;
  renderer.setSize(w,h,false);

  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(40,w/h,0.01,200);
  target=new THREE.Vector3(0,0.7,0);

  // Lighting
  scene.add(new THREE.AmbientLight(0xCCDDFF,0.25));
  var key=new THREE.DirectionalLight(0xFFEEDD,3.0);
  key.position.set(7,9,5);key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.near=0.5;key.shadow.camera.far=35;
  key.shadow.camera.left=-7;key.shadow.camera.right=7;
  key.shadow.camera.top=7;key.shadow.camera.bottom=-7;
  key.shadow.bias=-0.001;scene.add(key);
  var fill=new THREE.DirectionalLight(0x7799CC,0.9);fill.position.set(-8,5,2);scene.add(fill);
  var rim=new THREE.DirectionalLight(0x99BBDD,1.4);rim.position.set(-1,7,-10);scene.add(rim);
  scene.add(new THREE.HemisphereLight(0x223355,0x080D14,0.5));

  // Floor
  var floorMat=new THREE.MeshStandardMaterial({color:0x080D14,roughness:0.03,metalness:0.9});
  var floor=new THREE.Mesh(new THREE.PlaneGeometry(50,50),floorMat);
  floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;floor.position.y=-0.002;scene.add(floor);

  // Glow rings
  for(var i=0;i<4;i++){
    var ring=new THREE.Mesh(
      new THREE.RingGeometry(1.8+i*1.8,1.9+i*1.8,64),
      new THREE.MeshBasicMaterial({color:0x1A4A7A,side:THREE.DoubleSide,transparent:true,opacity:0.18-i*0.04})
    );
    ring.rotation.x=-Math.PI/2;ring.position.y=0.001;scene.add(ring);
  }

  // Sky
  var skyGeo=new THREE.SphereGeometry(90,32,16);
  var skyMat=new THREE.ShaderMaterial({
    uniforms:{top:{value:new THREE.Color(0x020408)},mid:{value:new THREE.Color(0x060D18)},hor:{value:new THREE.Color(0x0D1E30)}},
    vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:'uniform vec3 top,mid,hor;varying vec3 vP;void main(){float h=normalize(vP).y;vec3 c=h>0.15?mix(mid,top,smoothstep(0.15,0.7,h)):mix(hor,mid,smoothstep(-0.1,0.15,h));gl_FragColor=vec4(c,1.0);}',
    side:THREE.BackSide,depthWrite:false
  });
  scene.add(new THREE.Mesh(skyGeo,skyMat));
  scene.fog=new THREE.FogExp2(0x080D14,0.02);

  updateCam();animate();loadGLB();
}

function updateCam(){
  camera.position.set(
    target.x+radius*Math.sin(phi)*Math.sin(theta),
    target.y+radius*Math.cos(phi),
    target.z+radius*Math.sin(phi)*Math.cos(theta)
  );
  camera.lookAt(target);
}

function animate(){requestAnimationFrame(animate);if(autoRot){theta+=0.003;updateCam();}renderer.render(scene,camera);}

function resize(){
  var cv=document.getElementById('cv');
  var w=cv.clientWidth,h=cv.clientHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.updateProjectionMatrix();
}

function parseMatColor(n){
  if(!n)return null;var nl=n.toLowerCase();
  if(nl.indexOf('white')>-1)return{hex:0xF4F4F4,rough:0.2,metal:0.0};
  if(nl.indexOf('black')>-1||nl.indexOf('oxide')>-1)return{hex:0x111111,rough:0.4,metal:0.0};
  if(nl.indexOf('oak')>-1)return{hex:0xC4945A,rough:0.65,metal:0.0};
  if(nl.indexOf('mahogany')>-1)return{hex:0x7B3F2A,rough:0.5,metal:0.0};
  if(nl.indexOf('bamboo')>-1)return{hex:0xC8A96E,rough:0.5,metal:0.0};
  if(nl.indexOf('steel')>-1||nl.indexOf('satin')>-1)return{hex:0xAAAAAA,rough:0.25,metal:0.85};
  if(nl.indexOf('blue')>-1)return{hex:0x2030A0,rough:0.4,metal:0.0};
  if(nl.indexOf('led')>-1)return{hex:0xFFFFEE,rough:0.1,metal:0.0};
  var op=n.match(/Opaque\((\d+),(\d+),(\d+)\)/);
  if(op){var r=parseInt(op[1]),g=parseInt(op[2]),b=parseInt(op[3]),br=(r+g+b)/3;return{hex:(r<<16)|(g<<8)|b,rough:br<30?0.85:br>200?0.2:0.55,metal:br>80&&br<180&&Math.abs(r-g)<15&&Math.abs(g-b)<15?0.4:0.0};}
  var rgb=n.match(/^(\d+),(\d+),(\d+)/);
  if(rgb){var r=parseInt(rgb[1]),g=parseInt(rgb[2]),b=parseInt(rgb[3]),br=(r+g+b)/3;return{hex:(r<<16)|(g<<8)|b,rough:br<30?0.85:br>200?0.2:0.55,metal:br>80&&br<180&&Math.abs(r-g)<15&&Math.abs(g-b)<15?0.4:0.0};}
  return null;
}

function loadGLB(){
  var fill=document.getElementById('ov-fill');
  var txt=document.getElementById('ov-txt');
  var ov=document.getElementById('ov');
  fill.style.width='8%';
  new THREE.GLTFLoader().load('van_exterior.glb',function(gltf){
    var mdl=gltf.scene;
    var box=new THREE.Box3().setFromObject(mdl);
    var size=box.getSize(new THREE.Vector3());
    var centre=box.getCenter(new THREE.Vector3());
    var maxDim=Math.max(size.x,size.y,size.z);
    var scl=5.0/maxDim;
    mdl.scale.set(scl,scl,scl);
    mdl.position.set(-centre.x*scl,0,-centre.z*scl);
    var wrapper=new THREE.Group();
    wrapper.add(mdl);
    mdl.rotation.x=-Math.PI/2;
    scene.add(wrapper);
    var wb=new THREE.Box3().setFromObject(wrapper);
    wrapper.position.y=-wb.min.y;
    scene.remove(wrapper);
    var matCache={};
    mdl.traverse(function(c){
      if(!c.isMesh)return;
      c.castShadow=true;c.receiveShadow=true;
      var n=c.material?(c.material.name||''):'';
      if(!matCache[n]){var p=parseMatColor(n);if(p){var m=c.material.clone();m.color.setHex(p.hex);m.roughness=p.rough;m.metalness=p.metal;m.needsUpdate=true;matCache[n]=m;}else matCache[n]=c.material;}
      c.material=matCache[n];
    });
    scene.add(wrapper);
    fill.style.width='100%';
    resize();renderer.render(scene,camera);
    setTimeout(function(){
      ov.classList.add('gone');
      document.getElementById('info-panel').classList.add('visible');
      resize();
    },500);
    // Hide hint after 4 seconds
    setTimeout(function(){document.getElementById('hint').classList.add('hidden');},4000);
  },function(xhr){
    if(xhr.total){var pct=xhr.loaded/xhr.total*85;fill.style.width=(8+pct)+'%';if(pct>50)txt.textContent='Almost ready';}
  },function(err){txt.textContent='Error loading model';console.error(err);});
}

// Controls
var cv=document.getElementById('cv');
cv.addEventListener('mousedown',function(e){drag=true;lx=e.clientX;ly=e.clientY;autoRot=false;document.getElementById('cb-auto').classList.remove('on');});
window.addEventListener('mouseup',function(){drag=false;});
window.addEventListener('mousemove',function(e){
  if(!drag)return;
  if(panMode){
    var right=new THREE.Vector3();
    right.crossVectors(camera.getWorldDirection(new THREE.Vector3()),new THREE.Vector3(0,1,0)).normalize();
    var spd=radius*0.0015;
    target.addScaledVector(right,-(e.clientX-lx)*spd);
    target.y=Math.max(0,Math.min(3,target.y+(e.clientY-ly)*spd));
  }else{
    theta-=(e.clientX-lx)*0.007;
    phi=Math.max(0.25,Math.min(Math.PI*0.55,phi+(e.clientY-ly)*0.005));
  }
  lx=e.clientX;ly=e.clientY;updateCam();
});
cv.addEventListener('wheel',function(e){radius=Math.max(2,Math.min(20,radius+e.deltaY*0.012));updateCam();},{passive:true});

var tx=0,ty=0,pd=0;
cv.addEventListener('touchstart',function(e){
  autoRot=false;document.getElementById('cb-auto').classList.remove('on');
  if(e.touches.length===1){tx=e.touches[0].clientX;ty=e.touches[0].clientY;}
  else{pd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}
},{passive:true});
cv.addEventListener('touchmove',function(e){
  e.preventDefault();
  if(e.touches.length===1){
    if(panMode){
      var right=new THREE.Vector3();
      right.crossVectors(camera.getWorldDirection(new THREE.Vector3()),new THREE.Vector3(0,1,0)).normalize();
      var spd=radius*0.002;
      target.addScaledVector(right,-(e.touches[0].clientX-tx)*spd);
      target.y=Math.max(0,Math.min(3,target.y+(e.touches[0].clientY-ty)*spd));
    }else{
      theta-=(e.touches[0].clientX-tx)*0.009;
      phi=Math.max(0.25,Math.min(Math.PI*0.55,phi+(e.touches[0].clientY-ty)*0.007));
    }
    tx=e.touches[0].clientX;ty=e.touches[0].clientY;updateCam();
  }else{
    var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    radius=Math.max(2,Math.min(20,radius-(d-pd)*0.05));pd=d;updateCam();
  }
},{passive:false});

window.addEventListener('keydown',function(e){
  switch(e.key){
    case 'ArrowLeft':theta-=0.08;updateCam();e.preventDefault();break;
    case 'ArrowRight':theta+=0.08;updateCam();e.preventDefault();break;
    case 'ArrowUp':phi=Math.max(0.25,phi-0.05);updateCam();e.preventDefault();break;
    case 'ArrowDown':phi=Math.min(Math.PI*0.55,phi+0.05);updateCam();e.preventDefault();break;
    case '+':case '=':radius=Math.max(2,radius-0.5);updateCam();break;
    case '-':radius=Math.min(20,radius+0.5);updateCam();break;
  }
});

function zoomIn(){radius=Math.max(2,radius-1);updateCam();}
function zoomOut(){radius=Math.min(20,radius+1);updateCam();}
function toggleAuto(){autoRot=!autoRot;document.getElementById('cb-auto').classList.toggle('on',autoRot);}
function togglePan(){panMode=!panMode;document.getElementById('cb-pan').classList.toggle('on',panMode);cv.style.cursor=panMode?'move':'grab';}
function resetCam(){theta=0.3;phi=0.9;radius=9;target.set(0,0.7,0);updateCam();}
window.addEventListener('resize',resize);

function boot(){if(typeof THREE==='undefined'||typeof THREE.GLTFLoader==='undefined'){setTimeout(boot,50);return;}setup();}
boot();
</script>
</body>
</html>
